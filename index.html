<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <title>MOVIEFLIX</title>
</head>

<body>
    <div class="netflix-app">
        <nav class="topbar" id="topbar">
            <a class="brand" href="index.html" aria-label="MOVIEFLIX home">
                <img src="img/logo.png" alt="MOVIEFLIX">
            </a>

            <ul class="nav_links">
                <li><a href="index.html" class="active">HOME</a></li>
                <li><a href="TV SHOWS.html">TV SHOWS</a></li>
                <li><a href="Movies.html">MOVIES</a></li>
                <li><a href="kids.html">KIDS</a></li>
            </ul>

            <div class="nav_tools">
                <label class="search_box" for="search_input">
                    <i class="bi bi-search"></i>
                    <input type="search" id="search_input" placeholder="Titles, people, genres" autocomplete="off">
                </label>
                <button class="icon_btn" type="button" aria-label="Notifications">
                    <i class="bi bi-bell"></i>
                </button>
                <a class="profile_link" href="login.htm" aria-label="Open profile">
                    <img src="https://w0.peakpx.com/wallpaper/701/315/HD-wallpaper-ajith-deena-movie-actor-south-indian.jpg" alt="Profile">
                </a>
            </div>

            <section class="search_results" id="search_results" aria-live="polite"></section>
        </nav>

        <header class="hero" id="hero">
            <div class="hero_bg" id="hero_background"></div>
            <div class="hero_overlay"></div>
            <section class="hero_content">
                <p class="hero_kicker" id="hero_kicker">Now streaming</p>
                <h1 id="title">MOVIEFLIX</h1>
                <div class="meta_line" id="hero_meta"></div>
                <p id="description">Loading the latest movies and shows from TMDB.</p>
                <div class="hero_actions">
                    <button class="primary_btn" type="button" id="play">
                        <i class="bi bi-play-fill"></i>
                        Watch Trailer
                    </button>
                    <button class="secondary_btn" type="button" id="more_info">
                        <i class="bi bi-info-circle"></i>
                        More Info
                    </button>
                </div>
            </section>
        </header>

        <main class="browse">
            <section class="billboard_strip" id="billboard_strip"></section>
            <section class="rows" id="rows"></section>
        </main>
    </div>

    <section class="detail_modal" id="detail_modal" aria-hidden="true">
        <div class="modal_panel" role="dialog" aria-modal="true" aria-labelledby="detail_title">
            <button class="modal_close" type="button" data-close-modal aria-label="Close">
                <i class="bi bi-x-lg"></i>
            </button>
            <div class="modal_hero" id="detail_backdrop"></div>
            <section class="modal_content">
                <h2 id="detail_title"></h2>
                <div class="meta_line" id="detail_meta"></div>
                <p id="detail_overview"></p>
                <div class="hero_actions">
                    <button class="primary_btn" type="button" id="detail_trailer">
                        <i class="bi bi-play-fill"></i>
                        Watch Trailer
                    </button>
                    <button class="round_btn" type="button" aria-label="Add to list">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                    <button class="round_btn" type="button" aria-label="Like">
                        <i class="bi bi-hand-thumbs-up"></i>
                    </button>
                </div>
            </section>
        </div>
    </section>

    <section class="trailer_modal" id="trailer_modal" aria-hidden="true">
        <div class="trailer_panel" role="dialog" aria-modal="true" aria-label="Trailer player">
            <button class="modal_close" type="button" data-close-trailer aria-label="Close trailer">
                <i class="bi bi-x-lg"></i>
            </button>
            <div class="trailer_frame" id="trailer_frame"></div>
            <p class="trailer_status" id="trailer_status"></p>
        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
